name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark CI as running
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'CI / Quality',
              description: 'CI quality gate running',
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check onboarding docs
        run: npm run check:onboarding

      - name: Audit docs
        run: npm run audit:docs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Page 61 architecture contract
        run: npm run check:page61-architecture

      - name: Check i18n
        run: npm run check:i18n

      - name: Test
        run: npm run test

      - name: Mock mode regression tests
        run: npm run test:mock-mode

      - name: Self-test Page 61 visual gate
        run: node scripts/governance/self-test-page-61-visual-gate.mjs

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build
        run: npm run build

      - name: Publish CI commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'CI / Quality',
              description: passed ? 'CI quality gate PASS' : 'CI quality gate FAIL',
            });
