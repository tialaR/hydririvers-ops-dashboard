name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check onboarding docs
        run: npm run check:onboarding

      - name: Audit docs
        run: npm run audit:docs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check i18n
        run: npm run check:i18n

      - name: Test
        run: npm run test

      - name: Mock mode regression tests
        run: npm run test:mock-mode

      - name: Build
        run: npm run build
