name: SHARKLOCK Visual Page 61

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sharklock-visual-page-61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-61-visual-certification:
    name: Page 61 / 219:254 / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v4

      - name: Mark SHARKLOCK as running
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'SHARKLOCK / Page 61',
              description: 'SHARKLOCK Page 61 running',
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'SHARKLOCK / Page 62 D04-D05',
              description: 'Page 62 D04-D05 visual certification running',
            });

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare evidence directory
        run: mkdir -p reports/sharklock-evidence/page-61/logs

      - name: Install locked dependencies
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee reports/sharklock-evidence/page-61/logs/npm-ci.log

      - name: Install supported Chromium
        id: chromium
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee reports/sharklock-evidence/page-61/logs/chromium-install.log

      - name: Build Storybook component contract
        id: storybook
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build-storybook 2>&1 | tee reports/sharklock-evidence/page-61/logs/storybook-build.log

      - name: Certify Page 61 Storybook components
        id: components
        if: steps.storybook.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 6106 --directory storybook-static > reports/sharklock-evidence/page-61/logs/storybook-server.log 2>&1 &
          storybook_pid=$!
          trap 'kill "$storybook_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6106/iframe.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat reports/sharklock-evidence/page-61/logs/storybook-server.log
              exit 1
            fi
            sleep 1
          done
          PAGE61_STORYBOOK_URL=http://127.0.0.1:6106 node scripts/governance/certify-page-61-storybook-components.mjs 2>&1 | tee reports/sharklock-evidence/page-61/logs/storybook-components.log
          PAGE61_STORYBOOK_URL=http://127.0.0.1:6106 node scripts/governance/certify-shipment-card-storybook-variants.mjs 2>&1 | tee reports/sharklock-evidence/page-61/logs/shipment-card-variants.log

      - name: Certify Page 62 D04-D05 Storybook surfaces
        id: page62
        if: steps.storybook.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/sharklock-evidence/page-62/logs
          python3 -m http.server 6106 --directory storybook-static > reports/sharklock-evidence/page-62/logs/storybook-server.log 2>&1 &
          storybook_pid=$!
          trap 'kill "$storybook_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6106/iframe.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat reports/sharklock-evidence/page-62/logs/storybook-server.log
              exit 1
            fi
            sleep 1
          done
          PAGE62_STORYBOOK_URL=http://127.0.0.1:6106 npm run check:page62-d04-d05-visual 2>&1 | tee reports/sharklock-evidence/page-62/logs/d04-d05-visual.log

      - name: Build candidate runtime
        id: build
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee reports/sharklock-evidence/page-61/logs/build.log

      - name: Capture Page 61 at 1440x1024
        id: capture
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          HYDRORIVERS_EXPOSE_OTP_CODE: 'true'
          HYDRORIVERS_ALLOW_MOCK_MODE_RESET: 'true'
          HYDRORIVERS_FORCE_MOCK_QA_UI: 'true'
          HYDRORIVERS_FORCE_QA_DIRECT_LOGIN: 'true'
        run: |
          set -o pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 > reports/sharklock-evidence/page-61/logs/runtime.log 2>&1 &
          runtime_pid=$!
          trap 'kill "$runtime_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/pt-BR/login >/dev/null; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat reports/sharklock-evidence/page-61/logs/runtime.log
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              cat reports/sharklock-evidence/page-61/logs/runtime.log
              exit 1
            fi
            sleep 2
          done
          npx playwright test tests/e2e/page-61-visual-ci.spec.ts \
            --config=playwright.page-61-visual-ci.config.ts \
            --project=chromium \
            --reporter=line 2>&1 | tee reports/sharklock-evidence/page-61/logs/capture.log

      - name: Compute canonical diff and SHARKLOCK evidence
        id: visual
        if: always() && steps.dependencies.outcome == 'success' && steps.chromium.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SHARKLOCK_CANDIDATE_SHA: ${{ github.sha }}
          SHARKLOCK_CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          set -o pipefail
          node scripts/governance/certify-page-61-visual.mjs 2>&1 | tee reports/sharklock-evidence/page-61/logs/visual-certification.log

      - name: Record incomplete evidence chain
        if: always()
        shell: bash
        env:
          SHARKLOCK_CANDIDATE_SHA: ${{ github.sha }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          PAGE62_OUTCOME: ${{ steps.page62.outcome }}
          COMPONENTS_OUTCOME: ${{ steps.components.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { access, writeFile } from 'node:fs/promises';
          const target = 'reports/sharklock-evidence/page-61/sharklock-result.json';
          try {
            await access(target);
          } catch {
            const outcomes = {
              dependencies: process.env.DEPENDENCIES_OUTCOME,
              chromium: process.env.CHROMIUM_OUTCOME,
              build: process.env.BUILD_OUTCOME,
              capture: process.env.CAPTURE_OUTCOME,
              visual: process.env.VISUAL_OUTCOME,
              components: process.env.COMPONENTS_OUTCOME,
            };
            await writeFile(target, `${JSON.stringify({
              gate: 'SHARKLOCK-v2.0',
              requirementId: 'HY-VIS-61-DESKTOP-FOUNDATION',
              candidateSha: process.env.SHARKLOCK_CANDIDATE_SHA,
              chromiumStatus: outcomes.chromium === 'success' ? 'PASS' : 'FAIL',
              captureStatus: outcomes.capture === 'success' ? 'PASS' : 'FAIL',
              visualStatus: 'NÃO PROVADO',
              evidenceChainStatus: 'FAIL',
              certificationStatus: 'FAIL',
              outcomes,
              blockers: ['mandatory CI evidence chain is incomplete'],
            }, null, 2)}\n`);
          }
          NODE

      - name: Upload SHARKLOCK visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharklock-page-61-${{ github.sha }}
          path: |
            reports/sharklock-evidence/page-61
            reports/sharklock-evidence/page-62
            test-results/page-61-visual-ci
            docs/governance/figma-freeze/page-61/m01-desktop-foundation-parity-review.png
            docs/governance/figma-freeze/page-62/d04-cargo-cockpit-reference.webp
            docs/governance/figma-freeze/page-62/d05-operational-timeline-reference.webp
          if-no-files-found: error
          retention-days: 30

      - name: Publish SHARKLOCK commit status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = 'reports/sharklock-evidence/page-61/sharklock-result.json';
            let state = 'failure';
            let description = 'SHARKLOCK evidence unavailable';
            let pixels = '?';
            let rmse = '?';
            let perceptualRatio = '?';
            let pass = false;
            try {
              const result = JSON.parse(fs.readFileSync(path, 'utf8'));
              const metrics = result.metrics || {};
              const raw = metrics.raw || metrics;
              const perceptual = metrics.perceptual || {};
              pixels = Number.isFinite(raw.divergentPixels) ? raw.divergentPixels : '?';
              rmse = Number.isFinite(raw.rmse) ? Number(raw.rmse).toFixed(6) : '?';
              perceptualRatio = Number.isFinite(perceptual.diffRatio)
                ? `${(Number(perceptual.diffRatio) * 100).toFixed(3)}%`
                : '?';
              pass = result.certificationStatus === 'PASS' && result.evidenceChainStatus === 'PASS';
              state = pass ? 'success' : 'failure';
              description = `raw ${pixels}px | perceptual ${perceptualRatio} | ${pass ? 'PASS' : 'FAIL'}`;
            } catch (error) {
              description = 'SHARKLOCK result JSON missing or unreadable';
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'SHARKLOCK / Page 61',
              description: description.slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}?sharklock_pixels=${encodeURIComponent(String(pixels))}&sharklock_rmse=${encodeURIComponent(String(rmse))}&sharklock_result=${pass ? 'PASS' : 'FAIL'}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: `SHARKLOCK metrics / raw ${pixels}px / perceptual ${perceptualRatio}`,
              description: description.slice(0, 140),
            });

      - name: Publish Page 62 D04-D05 commit status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = 'reports/sharklock-evidence/page-62/d04-d05/page62-d04-d05-visual-result.json';
            let state = 'failure';
            let description = 'Page 62 D04-D05 evidence unavailable';
            try {
              const result = JSON.parse(fs.readFileSync(path, 'utf8'));
              const rows = result.results || [];
              const summary = rows
                .map((row) => `${row.name.replace(/^D0[45] /, '')} ${(Number(row.metrics?.perceptualDiffRatio || 0) * 100).toFixed(2)}%`)
                .join(' | ');
              const pass = result.status === 'PASS';
              state = pass ? 'success' : 'failure';
              description = `${summary} | ${pass ? 'PASS' : 'FAIL'}`.slice(0, 140);
            } catch (error) {}
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'SHARKLOCK / Page 62 D04-D05',
              description,
            });

      - name: Enforce complete evidence chain
        if: always()
        shell: bash
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = success
          test "$CHROMIUM_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$CAPTURE_OUTCOME" = success
          test "$VISUAL_OUTCOME" = success
          test "$PAGE62_OUTCOME" = success
          node -e "const r=require('./reports/sharklock-evidence/page-61/sharklock-result.json'); if(r.certificationStatus!=='PASS'||r.evidenceChainStatus!=='PASS') process.exit(1)"
