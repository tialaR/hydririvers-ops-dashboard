name: Visual Quality

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipper-visual-proof:
    name: Shipper visual proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run portfolio visual proof
        run: npm run test:portfolio-visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-evidence
          path: |
            reports/portfolio-visual-evidence
            reports/portfolio-visual-html
            test-results/portfolio-visual
          if-no-files-found: warn
          retention-days: 14
