name: Agentic Integrity

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'chore/**'
  pull_request:

concurrency:
  group: agentic-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  releaselock:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: RELEASELOCK agentic foundation
        run: npm run agentic:release -- --manifest=agentic-foundation

      - name: Upload agentic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-evidence-${{ github.sha }}
          path: reports/agentic-evidence
          if-no-files-found: warn
          retention-days: 30
