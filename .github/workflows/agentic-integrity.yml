name: Agentic Integrity

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'chore/**'
  pull_request:

concurrency:
  group: agentic-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staticlock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: STATICLOCK
        env:
          AGENTIC_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: npm run agentic:static
