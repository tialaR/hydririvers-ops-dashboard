<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
<title id="title">Radar pulsante amarelo</title>
<desc id="desc">Dot de radar amarelo com anéis pulsantes, pronto para uso em HTML.</desc>
<style>
  .radar-dot { transform-box: fill-box; transform-origin: center; }
  .pulse-a, .pulse-b { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .pulse-a { animation: radarPulse 1.85s ease-out infinite; }
  .pulse-b { animation: radarPulse 1.85s ease-out infinite; animation-delay: .62s; }
  .core-glow { animation: coreBreath 1.35s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .beam { animation: beamBreath 1.8s ease-in-out infinite; transform-origin: 32px 40px; }
  @keyframes radarPulse {
    0% { transform: scale(.62); opacity: .72; stroke-width: 2.8; }
    58% { opacity: .3; }
    100% { transform: scale(1.46); opacity: 0; stroke-width: .9; }
  }
  @keyframes coreBreath {
    0%, 100% { transform: scale(.94); opacity: .86; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  @keyframes beamBreath {
    0%, 100% { opacity: .55; }
    50% { opacity: .95; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-a, .pulse-b, .core-glow, .beam { animation: none; }
    .pulse-a { opacity: .45; transform: scale(1.05); }
    .pulse-b { opacity: .18; transform: scale(1.32); }
  }
</style>
<defs>
  <radialGradient id="amberCore" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff7bf"/>
    <stop offset="48%" stop-color="#eac86d"/>
    <stop offset="100%" stop-color="#a97934"/>
  </radialGradient>
  <radialGradient id="amberHalo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd979" stop-opacity=".48"/>
    <stop offset="62%" stop-color="#dca452" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#dca452" stop-opacity="0"/>
  </radialGradient>
  <filter id="amberGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#amberGlow)">
  <circle class="pulse-b" cx="32" cy="32" r="13.5" fill="none" stroke="#dba75a"/>
  <circle class="pulse-a" cx="32" cy="32" r="13.5" fill="none" stroke="#f1c86d"/>
  <circle cx="32" cy="32" r="22" fill="url(#amberHalo)" opacity=".42"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#bf914e" stroke-width="2.2" opacity=".72"/>
  <g class="radar-dot core-glow">
    <circle cx="32" cy="32" r="9.3" fill="#1f352f" opacity=".86"/>
    <circle cx="32" cy="32" r="7.1" fill="url(#amberCore)"/>
    <circle cx="32" cy="32" r="4.9" fill="#fff3ac" opacity=".78"/>
  </g>
</g>
</svg>